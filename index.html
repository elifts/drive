<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Remaining">
        <h1>TIME REMAINING: </h1>
        <div class="Remainingnum">
            <p id="weeksleft">...</p>
        </div>
        <div class="Remainingnum">
            <p id="daysleft">...</p>
        </div>
        <div class="Remainingnum">
            <p id="hoursleft">...</p>
        </div>
        <div class="Remainingnum">
            <p id="minutesleft">...</p>
        </div>
        <div class="Remainingnum">
            <p id="secondsleft">...</p>
        </div>
        <div class="Remainingnum">
            <p id="milisecondsleft">...</p>
        </div>
    </div>
    <div class="driving">
        <h1 class="hoursssss">DRIVING HOURS:</h1>

        <div class="Remaininghours">
            <p id="dayhours" class="buttionsize">...</p>
            <div class="Remaininghoursbuttons">
                <button class="dayhoursbutton" style="width: 20px; height: 20px;" onclick="addhour()">+</button>
                <button class="dayhoursbutton" style="width: 20px; height: 20px;" onclick="subhour()">-</button>
            </div>
        </div>
        <div class="Remaininghours">
            <p id="dayminutes" class="buttionsize">...</p>
            <div class="Remaininghoursbuttons">
                <button class="dayminutesbutton" onclick="addminute()">+</button>
                <button class="dayminutesbutton" onclick="subminute()">-</button>
            </div>
        </div>

        <p>+</p>

        <div class="Remaininghours">
            <p id="nighthours" class="buttionsize">...</p>
            <div class="Remaininghoursbuttons">
                <button class="nighthoursbutton" style="width: 20px; height: 20px;" onclick="naddhour()">+</button>
                <button class="nighthoursbutton" style="width: 20px; height: 20px;" onclick="nsubhour()">-</button>
            </div>
        </div>
        <div class="Remaininghours">
            <p id="nightminutes" class="buttionsize">...</p>
            <div class="Remaininghoursbuttons">
                <button class="nightminutesbutton" onclick="naddminute()">+</button>
                <button class="nightminutesbutton" onclick="nsubminute()">-</button>
            </div>
        </div>
        <p>=</p>
        <div class="Remaininghours">
            <p id="totalhours" class="buttionsize">...</p>
        </div>
        <div class="Remaininghours">
            <p id="totalmins" class="buttionsize">...</p>
        </div>
    </div>

    <div class="dis">
        <h1>distance: </h1>
        <div class="distance">
            <p id="km" class="km">...</p>
            <div class="kmbuttons">
                <button class="km" onclick="addkm()">+</button>
                <button class="km" onclick="subkm()">-</button>
            </div>
        </div>
        <div class="distance">
            <p id="meters" class="meters">...</p>
        </div>
        <div class="distance">
            <p id="speed" class="speed">...</p>
        </div>
        <div class="distance">
            <p id="distiancetoepping" class="km">...</p>
            <div class="scbuttons">
                <button class="ep" onclick="addep()">+</button>
                <button class="ep" onclick="subep()">-</button>
            </div>
        </div>
        <div class="distance">
            <p id="distiancetoschool" class="km">...</p>
            <div class="scbuttons">
                <button class="sc" onclick="addsc()">+</button>
                <button class="sc" onclick="subsc()">-</button>
            </div>
        </div>
    </div>
    <div class="calculations">
        <h1>CALCULATIONS: </h1>
        <div class="calculationsnum">
            <p id="hoursperweek">...</p>
        </div>
        <div class="calculationsnum">
            <p id="remaininghours">...</p>
        </div>
        <div class="calculationsnum">
            <p id="remainingnighthours">...</p>
        </div>
    </div>
    <div class="loadingbar"></div>
    <script src="code.js"></script>

</body>
</html>
